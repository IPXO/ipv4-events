name: Fetch news feed

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch RSS feeds and write news.json
        run: node scripts/fetch-news.mjs

      - name: Commit updated news.json (if changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the GitHub Contents API so the commit is marked "verified"
          # (required by signed-commit branch protection rules).
          if git diff --quiet docs/data/news.json 2>/dev/null && \
             git ls-files --error-unmatch docs/data/news.json 2>/dev/null; then
            echo "No changes — skipping."
            exit 0
          fi
          SHA=$(gh api "repos/${{ github.repository }}/contents/docs/data/news.json" \
                  --jq '.sha' 2>/dev/null || echo "")
          CONTENT=$(base64 -w 0 docs/data/news.json)
          gh api "repos/${{ github.repository }}/contents/docs/data/news.json" \
            --method PUT \
            --field message="chore: update news feed [skip ci]" \
            --field content="$CONTENT" \
            ${SHA:+--field sha="$SHA"}
          echo "Committed news.json via GitHub API."
